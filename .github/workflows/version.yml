# Keeps apis/_version.py in step with git so no version is ever edited by
# hand. The commit is made with GITHUB_TOKEN, and GitHub does not start
# workflow runs for events raised by GITHUB_TOKEN, so this cannot loop.
# paths-ignore is a second guard in case a PAT is ever used here instead.
name: Version

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'apis/_version.py'
  workflow_dispatch:

permissions:
  contents: write

# Every run pushes to the same branch, so serialize them.
concurrency:
  group: version-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 and fetch-tags are both required: without the tags,
      # git describe cannot see them and the version would be wrong.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Regenerate apis/_version.py from git
        run: python scripts/update_version.py

      - name: Commit when the version changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Stage first, then diff --cached: a brand new (untracked)
          # apis/_version.py is invisible to a plain `git diff`, which would
          # make this step silently skip creating it.
          git add -- apis/_version.py
          if git diff --cached --quiet -- apis/_version.py; then
            echo 'Version already current, nothing to commit.'
            exit 0
          fi

          version=$(python scripts/update_version.py --print)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apis/_version.py
          git commit -m "chore(version): ${version} [skip ci]"

          # A second push may have landed while this job was running, so
          # rebuild the commit on top of the newest branch tip and retry.
          # --autostash keeps the rebase working even if something else in
          # the job left the worktree dirty.
          if ! git push origin "HEAD:${DEFAULT_BRANCH}"; then
            git fetch origin "${DEFAULT_BRANCH}"
            git rebase --autostash "origin/${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
